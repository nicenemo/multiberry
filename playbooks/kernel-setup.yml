#!/usr/bin/env ansible-playbook
---
- name: Install Latest Optimized CachyOS Kernel
  hosts: gaming_box
  become: true

  vars:
    limine_default_entry: 'CachyOS/linux-cachyos'

  tasks:
    # -------------------------------------------------------------------------
    # 1. Refresh & Install Optimized Kernel
    # -------------------------------------------------------------------------
    - name: Refresh pacman sync databases
      ansible.builtin.command:
        cmd: pacman -Sy
      changed_when: true

    - name: Install main optimized CachyOS kernel and headers alongside LTS
      community.general.pacman:
        name:
          - linux-cachyos
          - linux-cachyos-headers
        state: present

    # -------------------------------------------------------------------------
    # 2. Kernel Command Line (Limine) Optimizations
    # -------------------------------------------------------------------------
    - name: Ensure /etc/kernel/cmdline exists
      ansible.builtin.file:
        path: /etc/kernel/cmdline
        state: touch
        owner: root
        group: root
        mode: '0644'
        modification_time: preserve
        access_time: preserve

    - name: Read the kernel tuning parameters
      ansible.builtin.set_fact:
        tuning_tokens: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/multiberry-tuning.conf').splitlines()
          | map('trim') | reject('match', '(#|$)') | list }}

    # Added to /etc/default/limine like on mikmakmuk, only when missing; see tasks/limine-cmdline.yml.
    - name: Apply high-performance kernel parameters
      ansible.builtin.include_tasks: tasks/limine-cmdline.yml
      vars:
        cmdline_tokens: "{{ tuning_tokens }}"
        cmdline_block_id: multiberry tuning

    # -------------------------------------------------------------------------
    # 3. Generic DKMS Module Rebuild & Initramfs
    # -------------------------------------------------------------------------
    - name: Find target module directory for linux-cachyos
      ansible.builtin.find:
        paths: /usr/lib/modules
        file_type: directory
        patterns: '*cachyos*'
        excludes: '*lts*'
      register: kernel_module_dirs

    - name: Extract target kernel release string
      ansible.builtin.set_fact:
        target_kernel_release: "{{ kernel_module_dirs.files | map(attribute='path') | map('basename') | first }}"
      when: kernel_module_dirs.files | length > 0

    - name: Rebuild configured DKMS modules for new kernel
      ansible.builtin.command:
        cmd: "dkms autoinstall -k {{ target_kernel_release }}"
      register: dkms_result
      changed_when: dkms_result.rc == 0
      when: target_kernel_release is defined

    - name: Rebuild initramfs images for all installed kernels
      ansible.builtin.command:
        cmd: mkinitcpio -P
      changed_when: true

    # -------------------------------------------------------------------------
    # 4. Limine Configuration Update
    # -------------------------------------------------------------------------
    - name: Ensure BOOT_ORDER prioritizes main CachyOS kernel in /etc/default/limine
      ansible.builtin.lineinfile:
        path: /etc/default/limine
        regexp: '^BOOT_ORDER=.*'
        line: 'BOOT_ORDER="*cachyos, *, *lts, *fallback, Snapshots"'
        create: true
        mode: '0644'

    - name: Regenerate Limine entries
      ansible.builtin.command:
        cmd: limine-entry-tool
      changed_when: true

    - name: Disable remember_last_entry in /boot/limine.conf
      ansible.builtin.replace:
        path: /boot/limine.conf
        regexp: '^\s*remember_last_entry\s*:\s*.*$'
        replace: 'remember_last_entry: no'

    - name: Ensure default_entry is explicitly set in /boot/limine.conf after regeneration
      ansible.builtin.lineinfile:
        path: /boot/limine.conf
        regexp: '^\s*default_entry\s*:.*$'
        line: "default_entry: {{ limine_default_entry }}"
        insertafter: '^timeout:'
        state: present
      register: limine_default_entry_set

    - name: Read the running kernel and its command line
      ansible.builtin.slurp:
        src: /proc/cmdline
      register: proc_cmdline_raw

    - name: Get running kernel version
      ansible.builtin.command:
        cmd: uname -r
      register: active_kernel
      changed_when: false

    # Only reboot when something that needs a reboot changed or is not yet active.
    - name: Determine whether a reboot is required
      ansible.builtin.set_fact:
        requires_reboot: >-
          {{ (limine_cmdline_changed | bool) or (limine_default_entry_set is changed)
          or (tuning_tokens | difference((proc_cmdline_raw.content | b64decode).split()) | length > 0)
          or ('cachyos' not in active_kernel.stdout) or ('lts' in active_kernel.stdout) }}

    # -------------------------------------------------------------------------
    # 5. Reboot & Kernel Verification
    # -------------------------------------------------------------------------
    - name: Reboot system into new optimized kernel
      ansible.builtin.reboot:
        msg: 'Rebooting to boot into linux-cachyos with the Limine kernel parameters'
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 2
        post_reboot_delay: 5
        test_command: uptime
      when: requires_reboot | bool

    - name: Get running kernel version after the reboot
      ansible.builtin.command:
        cmd: uname -r
      register: active_kernel
      changed_when: false

    - name: Read the running kernel command line after the reboot
      ansible.builtin.slurp:
        src: /proc/cmdline
      register: live_cmdline_raw

    - name: Verify running kernel is linux-cachyos
      ansible.builtin.assert:
        that:
          - "'lts' not in active_kernel.stdout"
          - "'cachyos' in active_kernel.stdout"
        fail_msg: "Failed to boot into optimized kernel. Active kernel: {{ active_kernel.stdout }}"
        success_msg: "Successfully booted into optimized kernel: {{ active_kernel.stdout }}"

    - name: Verify all tuning parameters are active in /proc/cmdline
      ansible.builtin.assert:
        that:
          - tuning_tokens | difference((live_cmdline_raw.content | b64decode).split()) | length == 0
        fail_msg: >-
          Missing parameters in /proc/cmdline:
          {{ tuning_tokens | difference((live_cmdline_raw.content | b64decode).split()) | join(' ') }}
        success_msg: "All {{ tuning_tokens | length }} tuning parameters are active in /proc/cmdline"
