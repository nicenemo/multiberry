#!/usr/bin/env ansible-playbook
---
- name: Teardown Ollama Build Workspace and Package Cache
  hosts: gaming_box
  become: true

  vars:
    build_dir: "/var/tmp/ollama-package-build"
    pkg_output_dir: "/var/cache/custom-packages"

  tasks:
    - name: Remove temporary Ollama build directory
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: absent

    - name: Remove cached custom Ollama packages
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      with_fileglob:
        - "{{ pkg_output_dir }}/ollama-*.pkg.tar.zst"
