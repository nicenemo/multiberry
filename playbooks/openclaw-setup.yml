#!/usr/bin/env ansible-playbook
---
- name: Deploy OpenClaw Stack and Configure Firewall
  hosts: gaming_box
  become: true

  vars:
    openclaw_port: 8080

  tasks:
    # -------------------------------------------------------------------------
    # 1. Directory Provisioning on Dedicated SSD
    # -------------------------------------------------------------------------
    - name: Ensure OpenClaw compose and workspace directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: docker
        mode: '0775'
      loop:
        - /opt/data/compose/openclaw
        - /opt/data/openclaw-data

    # -------------------------------------------------------------------------
    # 2. Render Template & Deploy Container Stack
    # -------------------------------------------------------------------------
    - name: Deploy OpenClaw docker-compose file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/docker-compose-openclaw.j2"
        dest: /opt/data/compose/openclaw/docker-compose.yml
        owner: root
        group: docker
        mode: '0640'

    - name: Start OpenClaw service via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /opt/data/compose/openclaw
        state: present

    # -------------------------------------------------------------------------
    # 3. Firewall Configuration (UFW)
    # -------------------------------------------------------------------------
    - name: Allow traffic on OpenClaw port
      community.general.ufw:
        rule: allow
        port: "{{ openclaw_port | string }}"
        proto: tcp
        comment: "OpenClaw access"
