#!/usr/bin/env ansible-playbook
---
- name: Teardown Ollama Service, Firewall Rule & Purge Data
  hosts: gaming_box
  become: true

  vars:
    pkg_output_dir: '/var/cache/custom-packages'

  tasks:
    # -------------------------------------------------------------------------
    # 1. Firewall Rule Removal
    # -------------------------------------------------------------------------
    - name: Remove UFW firewall rule for Ollama port
      community.general.ufw:
        rule: allow
        port: "{{ ollama_port | default(11434) | string }}"
        proto: tcp
        delete: true
      failed_when: false

    # -------------------------------------------------------------------------
    # 2. Service Termination & Disabling
    # -------------------------------------------------------------------------
    - name: Stop and disable Ollama service immediately
      ansible.builtin.systemd:
        name: ollama.service
        enabled: false
        state: stopped
      failed_when: false

    # -------------------------------------------------------------------------
    # 3. Configuration & Data Removal
    # -------------------------------------------------------------------------
    - name: Remove systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/ollama.service.d
        state: absent

    - name: Remove Ollama CLI environment configuration drop-ins
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/environment.d/60-ollama-cli.conf
        - /etc/profile.d/ollama.sh
        - /etc/fish/conf.d/ollama.fish

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Remove Ollama data directory and contents
      ansible.builtin.file:
        path: "{{ ollama_data_path | default('/opt/data/ollama') }}"
        state: absent

    # -------------------------------------------------------------------------
    # 4. Package Purge & Cache Clean
    # -------------------------------------------------------------------------
    - name: Purge all Ollama pacman packages (CUDA / Vulkan / Main)
      community.general.pacman:
        name:
          - ollama
          - ollama-cuda
          - ollama-vulkan
        state: absent

    - name: Remove custom built package files from cache
      ansible.builtin.file:
        path: "{{ pkg_output_dir }}"
        state: absent

    # -------------------------------------------------------------------------
    # 5. Verification
    # -------------------------------------------------------------------------
    - name: Verify Ollama service is stopped and inactive
      ansible.builtin.command: systemctl is-active ollama.service  # noqa: command-instead-of-module
      register: service_status
      failed_when: service_status.rc == 0
      changed_when: false

    - name: Display Teardown Status
      ansible.builtin.debug:
        msg: 'TEARDOWN SUCCESSFUL: Ollama service stopped, CLI profiles removed, packages purged, network port closed.'
