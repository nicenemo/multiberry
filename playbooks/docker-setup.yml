#!/usr/bin/env ansible-playbook
---
- name: Install and Configure Docker on Isolated Storage
  hosts: gaming_box
  become: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. Package Installation
    # -------------------------------------------------------------------------
    - name: Install Docker and Docker Compose
      community.general.pacman:
        name:
          - docker
          - docker-compose
        state: present

    - name: Reload systemd daemon to discover new unit files
      ansible.builtin.systemd:
        daemon_reload: true

    # -------------------------------------------------------------------------
    # 2. Directory Provisioning
    # -------------------------------------------------------------------------
    - name: Ensure dedicated Docker data directory exists
      ansible.builtin.file:
        path: /opt/data/docker
        state: directory
        owner: root
        group: root
        mode: '0711'

    - name: Ensure Docker compose directory exists for stacks
      ansible.builtin.file:
        path: /opt/data/compose
        state: directory
        owner: root
        group: docker
        mode: '0775'

    - name: Ensure Docker configuration directory exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: '0755'

    # -------------------------------------------------------------------------
    # 3. Daemon Configuration (Data Location & Security)
    # -------------------------------------------------------------------------
    - name: Configure Docker daemon data-root
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "data-root": "/opt/data/docker",
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
        owner: root
        group: root
        mode: '0644'
      notify: Restart Docker service

    # -------------------------------------------------------------------------
    # 4. Service Activation & User Delegation
    # -------------------------------------------------------------------------
    - name: Reset systemd failed state for Docker units
      ansible.builtin.command: systemctl reset-failed docker.service docker.socket
      changed_when: false
      failed_when: false

    - name: Ensure Docker socket and service are enabled and started
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - docker.socket
        - docker.service

    - name: Add gaming_box users to the docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ steam_users }}"

  handlers:
    - name: Restart Docker service
      ansible.builtin.systemd:
        name: docker.service
        state: restarted
