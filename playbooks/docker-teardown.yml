#!/usr/bin/env ansible-playbook
---
- name: Teardown Docker Service & Purge Data
  hosts: gaming_box
  become: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. Service Termination
    # -------------------------------------------------------------------------
    - name: Stop and disable Docker service and socket
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - docker.service
        - docker.socket
      failed_when: false

    # -------------------------------------------------------------------------
    # 2. Package Purge & Systemd Cleanup
    # -------------------------------------------------------------------------
    - name: Remove Docker packages
      community.general.pacman:
        name:
          - docker
          - docker-compose
        state: absent

    - name: Reload systemd daemon to unregister removed units
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Clear lingering failed states from systemd memory
      ansible.builtin.command: systemctl reset-failed
      changed_when: false
      failed_when: false

    # -------------------------------------------------------------------------
    # 3. User Access Revocation
    # -------------------------------------------------------------------------
    - name: Remove gaming_box users from docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        state: present
        remove_default_group: false
      loop: "{{ steam_users }}"
      failed_when: false

    # -------------------------------------------------------------------------
    # 4. Configuration & Storage Removal
    # -------------------------------------------------------------------------
    - name: Remove Docker configuration directory
      ansible.builtin.file:
        path: /etc/docker
        state: absent

    - name: Purge Docker compose directory
      ansible.builtin.file:
        path: /opt/data/compose
        state: absent

    - name: Purge Docker data directory and containers/images
      ansible.builtin.file:
        path: /opt/data/docker
        state: absent
