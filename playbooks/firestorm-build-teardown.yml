#!/usr/bin/env ansible-playbook
---
- name: Teardown Firestorm Build Workspace and Package Cache
  hosts: gaming_box
  become: true

  vars:
    build_dir: "/var/tmp/firestorm-package-build"
    pkg_output_dir: "/var/cache/custom-packages"

  tasks:
    - name: Remove temporary Firestorm build directory
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: absent

    - name: Remove cached custom Firestorm packages
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      with_fileglob:
        - "{{ pkg_output_dir }}/firestorm-viewer-*.pkg.tar.zst"
