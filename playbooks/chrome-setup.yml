#!/usr/bin/env ansible-playbook
---
- name: Install and Configure Google Chrome via Flatpak
  hosts: gaming_box
  become: true

  vars:
    target_users: "{{ firestorm_users }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Ensure Ansible Remote Tmp Directories Exist (Prevents Warnings)
    # -------------------------------------------------------------------------
    - name: Ensure Ansible remote tmp directory exists for all target users
      ansible.builtin.file:
        path: "/home/{{ item.name | default(item) }}/.ansible/tmp"
        state: directory
        owner: "{{ item.name | default(item) }}"
        group: "{{ item.group | default(item) }}"
        mode: '0700'
      loop: "{{ target_users }}"

    # -------------------------------------------------------------------------
    # 2. Application Installation
    # -------------------------------------------------------------------------
    - name: Install Google Chrome from Flathub
      community.general.flatpak:
        name: com.google.Chrome
        state: present
        method: system

    # -------------------------------------------------------------------------
    # 3. CLI Shortcut Creation
    # -------------------------------------------------------------------------
    - name: Create global symlink for 'google-chrome' CLI command
      ansible.builtin.file:
        src: /var/lib/flatpak/exports/bin/com.google.Chrome
        dest: /usr/local/bin/google-chrome
        state: link

    # -------------------------------------------------------------------------
    # 4. Refresh Desktop & Launcher Databases
    # -------------------------------------------------------------------------
    - name: Update system desktop database for menu integration
      ansible.builtin.command:
        cmd: update-desktop-database /var/lib/flatpak/exports/share/applications
      changed_when: false
      failed_when: false

    - name: Refresh KDE launcher cache for active user sessions
      ansible.builtin.command:
        cmd: kbuildsycoca6 --noincremental
      become_user: "{{ item.name | default(item) }}"
      loop: "{{ target_users }}"
      changed_when: false
      failed_when: false
