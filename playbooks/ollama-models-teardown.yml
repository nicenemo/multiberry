#!/usr/bin/env ansible-playbook
---
- name: Teardown Ollama Models
  hosts: gaming_box
  become: false

  vars:
    ollama_api_endpoint: "http://{{ ollama_ip_address | default('127.0.0.1') }}:{{ ollama_port | default(11434) }}"

  tasks:
    - name: Load pull list variable file
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars/ollama_pull.yml"
      failed_when: false

    - name: Build consolidated models list for teardown
      ansible.builtin.set_fact:
        effective_models_to_remove: >-
          {{
            ((ollama_models_to_pull | default([]))
            + (ollama_selected_models | default([]))
            + (ollama_hf_models | default([])))
            | unique
            | list
          }}

    - name: Remove models defined in pull list and inventory
      ansible.builtin.command:
        cmd: "ollama rm {{ item }}"
      environment:
        OLLAMA_HOST: "{{ ollama_api_endpoint }}"
      loop: "{{ effective_models_to_remove | default([]) }}"
      when:
        - effective_models_to_remove is defined
        - (effective_models_to_remove | length) > 0
      failed_when: false
      changed_when: true
