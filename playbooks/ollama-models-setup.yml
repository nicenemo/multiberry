#!/usr/bin/env ansible-playbook
---
- name: Install Ollama Models from Scraped Catalog & Inventory
  hosts: gaming_box
  become: false

  vars:
    ollama_api_endpoint: "http://{{ ollama_ip_address | default('127.0.0.1') }}:{{ ollama_port | default(11434) }}"

  tasks:
    - name: Load catalog and pull list variable files
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../vars/ollama_models.yml"
        - "{{ playbook_dir }}/../vars/ollama_pull.yml"
      failed_when: false

    - name: Build consolidated target models list
      ansible.builtin.set_fact:
        effective_models_to_pull: >-
          {{
            ((ollama_models_to_pull | default([]))
            + (ollama_selected_models | default([]))
            + (ollama_hf_models | default([])))
            | unique
            | list
          }}

    - name: Fetch currently installed models from Ollama API
      ansible.builtin.uri:
        url: "{{ ollama_api_endpoint }}/api/tags"
        method: GET
        status_code: 200
      register: installed_models_response
      when:
        - effective_models_to_pull is defined
        - (effective_models_to_pull | length) > 0

    - name: Extract installed model names and tags
      ansible.builtin.set_fact:
        installed_models: "{{ installed_models_response.json.models | default([]) | map(attribute='name') | list }}"
      when:
        - installed_models_response is defined
        - installed_models_response.json is defined

    - name: Pull missing Ollama models
      ansible.builtin.command:
        cmd: "ollama pull {{ item }}"
      environment:
        OLLAMA_HOST: "{{ ollama_api_endpoint }}"
      loop: "{{ effective_models_to_pull | default([]) }}"
      when:
        - effective_models_to_pull is defined
        - (effective_models_to_pull | length) > 0
        - item not in (installed_models | default([]))
        - (item + ':latest') not in (installed_models | default([]))
      register: pull_result
      changed_when: true
