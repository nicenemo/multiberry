#!/usr/bin/env ansible-playbook
---
- name: Teardown Hermes Agent Stack & Purge Data
  hosts: gaming_box
  become: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. Container Termination
    # -------------------------------------------------------------------------
    - name: Stop and remove Hermes Agent Docker Compose stack
      community.docker.docker_compose_v2:
        project_src: /opt/data/compose/hermes
        state: absent
      failed_when: false

    # -------------------------------------------------------------------------
    # 2. Storage Cleanup
    # -------------------------------------------------------------------------
    - name: Purge Hermes Agent compose and memory directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/data/compose/hermes
        - /opt/data/hermes-data
