#!/usr/bin/env ansible-playbook
---
# =============================================================================
# Master Provisioning Playbook
# =============================================================================

- name: Import Base Setup
  ansible.builtin.import_playbook: playbooks/base-setup.yml

- name: Import Kernel Setup
  ansible.builtin.import_playbook: playbooks/kernel-setup.yml

- name: Import NVIDIA GTX 1080 Setup
  ansible.builtin.import_playbook: playbooks/nvidia1080-setup.yml

- name: Import Steam & Proton Setup
  ansible.builtin.import_playbook: playbooks/steam-setup.yml

- name: Import wlsunset Setup
  ansible.builtin.import_playbook: playbooks/wlsunset-setup.yml

- name: Import Docker Setup
  ansible.builtin.import_playbook: playbooks/docker-setup.yml

- name: Import Ollama Setup
  ansible.builtin.import_playbook: playbooks/ollama-setup.yml
